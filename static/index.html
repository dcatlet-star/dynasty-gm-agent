<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Dynasty GM — MJBrutus</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --surface2: #1a1a26;
            --border: #2a2a3a;
            --accent: #00d4ff;
            --accent2: #ff6b35;
            --gold: #ffd700;
            --text: #e8e8f0;
            --text-dim: #6b6b8a;
            --user-bubble: #1e2a3a;
            --agent-bubble: #161620;
            --success: #00ff88;
            --warning: #ffaa00;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        .header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent), var(--accent2), transparent);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-mark {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 18px;
            color: var(--bg);
            letter-spacing: 0;
        }

        .header-title {
            display: flex;
            flex-direction: column;
        }

        .header-title-main {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 18px;
            letter-spacing: 2px;
            color: var(--text);
            line-height: 1;
        }

        .header-title-sub {
            font-size: 10px;
            color: var(--accent);
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 500;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .status-text {
            font-size: 11px;
            color: var(--success);
            font-weight: 500;
        }

        .clear-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.2s;
        }

        .clear-btn:hover, .clear-btn:active {
            border-color: var(--accent2);
            color: var(--accent2);
        }

        /* Quick actions */
        .quick-actions {
            padding: 10px 16px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            flex-shrink: 0;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            scrollbar-width: none;
        }

        .quick-actions::-webkit-scrollbar { display: none; }

        .quick-btn {
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .quick-btn:hover, .quick-btn:active {
            background: var(--surface2);
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Messages */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }

        .messages::-webkit-scrollbar { width: 4px; }
        .messages::-webkit-scrollbar-track { background: transparent; }
        .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        /* Welcome screen */
        .welcome {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            gap: 20px;
            padding: 32px 24px;
            text-align: center;
        }

        .welcome-icon {
            font-size: 48px;
            line-height: 1;
        }

        .welcome-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 32px;
            letter-spacing: 3px;
            background: linear-gradient(135deg, var(--accent), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .welcome-sub {
            font-size: 14px;
            color: var(--text-dim);
            line-height: 1.6;
            max-width: 280px;
        }

        .league-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .league-pill {
            background: var(--surface2);
            border: 1px solid var(--border);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            color: var(--text-dim);
            font-family: 'DM Mono', monospace;
        }

        .league-pill.active {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(0, 212, 255, 0.08);
        }

        /* Message bubbles */
        .message {
            display: flex;
            flex-direction: column;
            gap: 4px;
            animation: messageIn 0.3s ease;
        }

        @keyframes messageIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-items: flex-end;
        }

        .message.agent {
            align-items: flex-start;
        }

        .message-label {
            font-size: 10px;
            color: var(--text-dim);
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 600;
            padding: 0 4px;
        }

        .message.user .message-label {
            color: var(--accent2);
        }

        .message.agent .message-label {
            color: var(--accent);
        }

        .bubble {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
        }

        .message.user .bubble {
            background: var(--user-bubble);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-bottom-right-radius: 4px;
            color: var(--text);
        }

        .message.agent .bubble {
            background: var(--agent-bubble);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
            color: var(--text);
        }

        /* Image in bubble */
        .bubble img {
            max-width: 100%;
            border-radius: 8px;
            margin-bottom: 8px;
            display: block;
        }

        /* Markdown-like formatting in responses */
        .bubble strong {
            color: var(--gold);
            font-weight: 600;
        }

        .bubble em {
            color: var(--accent);
        }

        .bubble code {
            background: rgba(255,255,255,0.08);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'DM Mono', monospace;
            font-size: 12px;
            color: var(--accent);
        }

        /* Typing indicator */
        .typing {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            animation: typingBounce 1.2s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
            40% { transform: translateY(-6px); opacity: 1; }
        }

        .typing-text {
            font-size: 12px;
            color: var(--text-dim);
            font-style: italic;
        }

        /* Image preview */
        .image-preview {
            position: relative;
            padding: 8px 16px;
            background: var(--surface);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }

        .preview-inner {
            position: relative;
            display: inline-block;
        }

        .preview-img {
            height: 60px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .preview-remove {
            position: absolute;
            top: -6px;
            right: -6px;
            width: 20px;
            height: 20px;
            background: var(--accent2);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        /* Input area */
        .input-area {
            background: var(--surface);
            border-top: 1px solid var(--border);
            padding: 12px 16px;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            flex-shrink: 0;
        }

        .input-row {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 8px 8px 8px 14px;
            transition: border-color 0.2s;
        }

        .input-row:focus-within {
            border-color: var(--accent);
        }

        .message-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            resize: none;
            max-height: 120px;
            min-height: 24px;
            line-height: 1.5;
        }

        .message-input::placeholder {
            color: var(--text-dim);
        }

        .input-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 16px;
            flex-shrink: 0;
        }

        .upload-btn {
            background: var(--surface);
            color: var(--text-dim);
        }

        .upload-btn:hover, .upload-btn:active {
            background: var(--border);
            color: var(--text);
        }

        .send-btn {
            background: linear-gradient(135deg, var(--accent), #0099bb);
            color: var(--bg);
        }

        .send-btn:hover, .send-btn:active {
            background: linear-gradient(135deg, var(--accent2), #dd4400);
            transform: scale(0.95);
        }

        .send-btn:disabled {
            background: var(--border);
            color: var(--text-dim);
            transform: none;
            cursor: not-allowed;
        }

        #file-input {
            display: none;
        }

        /* League selector */
        .league-selector {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
            overflow-x: auto;
            scrollbar-width: none;
            padding-bottom: 2px;
        }

        .league-selector::-webkit-scrollbar { display: none; }

        .league-tab {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            white-space: nowrap;
            font-family: 'DM Mono', monospace;
            transition: all 0.15s;
            flex-shrink: 0;
        }

        .league-tab.selected {
            background: rgba(0, 212, 255, 0.1);
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Scrolled formatting in agent responses */
        .bubble p { margin-bottom: 8px; }
        .bubble p:last-child { margin-bottom: 0; }
        .bubble ul, .bubble ol { 
            padding-left: 16px; 
            margin-bottom: 8px;
        }
        .bubble li { margin-bottom: 4px; }
        .bubble h3 {
            font-family: 'Bebas Neue', sans-serif;
            letter-spacing: 1px;
            color: var(--gold);
            font-size: 16px;
            margin-bottom: 6px;
            margin-top: 12px;
        }
        .bubble h3:first-child { margin-top: 0; }
        .bubble hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 10px 0;
        }

        /* Responsive */
        @media (min-width: 768px) {
            body { max-width: 640px; margin: 0 auto; }
            .bubble { max-width: 75%; }
        }
    </style>
</head>
<body>

<div class="header">
    <div class="header-left">
        <div class="logo-mark">GM</div>
        <div class="header-title">
            <span class="header-title-main">Dynasty GM</span>
            <span class="header-title-sub">MJBrutus War Room</span>
        </div>
    </div>
    <div class="header-right">
        <div class="status-dot"></div>
        <span class="status-text">LIVE</span>
        <button class="clear-btn" onclick="clearChat()">Clear</button>
    </div>
</div>

<div class="quick-actions">
    <button class="quick-btn" onclick="quickQuery('trade')">⚡ Trade Eval</button>
    <button class="quick-btn" onclick="quickQuery('roster')">📋 Roster Audit</button>
    <button class="quick-btn" onclick="quickQuery('buylsell')">📈 Buy/Sell</button>
    <button class="quick-btn" onclick="quickQuery('waiver')">🎯 Waiver Wire</button>
    <button class="quick-btn" onclick="quickQuery('rookie')">🏈 Rookie Rankings</button>
    <button class="quick-btn" onclick="quickQuery('briefing')">📊 GM Briefing</button>
</div>

<div class="messages" id="messages">
    <div class="welcome" id="welcome">
        <div class="welcome-icon">🏈</div>
        <div class="welcome-title">War Room Active</div>
        <div class="welcome-sub">Your dynasty assistant is live with full league context and real-time data access.</div>
        <div class="league-pills">
            <div class="league-pill active">Capital Gains</div>
            <div class="league-pill active">Twenty Run Savages</div>
            <div class="league-pill active">Gentleman's</div>
            <div class="league-pill">Velvet Spade</div>
        </div>
    </div>
</div>

<div class="image-preview" id="image-preview" style="display:none">
    <div class="preview-inner">
        <img id="preview-img" class="preview-img" src="" alt="Preview">
        <button class="preview-remove" onclick="removeImage()">×</button>
    </div>
</div>

<div class="input-area">
    <div class="league-selector">
        <button class="league-tab selected" onclick="selectLeague(this, '')">All Leagues</button>
        <button class="league-tab" onclick="selectLeague(this, 'Capital Gains: ')">CG #430</button>
        <button class="league-tab" onclick="selectLeague(this, 'Twenty Run Savages: ')">TRS #210</button>
        <button class="league-tab" onclick="selectLeague(this, "Gentleman's Dynasty: ")">Gentleman's</button>
        <button class="league-tab" onclick="selectLeague(this, 'Velvet Spade: ')">Velvet Spade</button>
    </div>
    <div class="input-row">
        <textarea 
            class="message-input" 
            id="message-input"
            placeholder="Ask your GM anything..." 
            rows="1"
            onkeydown="handleKeydown(event)"
            oninput="autoResize(this)"
        ></textarea>
        <div class="input-actions">
            <input type="file" id="file-input" accept="image/*" onchange="handleFileUpload(event)">
            <button class="icon-btn upload-btn" onclick="document.getElementById('file-input').click()" title="Upload screenshot">
                📎
            </button>
            <button class="icon-btn send-btn" id="send-btn" onclick="sendMessage()" title="Send">
                ↑
            </button>
        </div>
    </div>
</div>

<script>
    let selectedImage = null;
    let selectedLeaguePrefix = '';
    let isLoading = false;

    function selectLeague(btn, prefix) {
        document.querySelectorAll('.league-tab').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedLeaguePrefix = prefix;
    }

    function autoResize(textarea) {
        textarea.style.height = 'auto';
        textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
    }

    function handleKeydown(e) {
        if (e.key === 'Enter' && !e.shiftKey && window.innerWidth > 768) {
            e.preventDefault();
            sendMessage();
        }
    }

    function handleFileUpload(event) {
        const file = event.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = (e) => {
            selectedImage = e.target.result;
            document.getElementById('preview-img').src = selectedImage;
            document.getElementById('image-preview').style.display = 'block';
        };
        reader.readAsDataURL(file);
        event.target.value = '';
    }

    function removeImage() {
        selectedImage = null;
        document.getElementById('image-preview').style.display = 'none';
        document.getElementById('preview-img').src = '';
    }

    function quickQuery(type) {
        const queries = {
            trade: 'Evaluate this trade for me: ',
            roster: `Run a full roster audit for my ${selectedLeaguePrefix || 'Capital Gains'} team. Identify strengths, weaknesses, and top 3 priorities.`,
            buylsell: 'Give me your top 3 buy-low and top 3 sell-high targets across all my leagues right now.',
            waiver: 'Who are the best waiver wire adds available right now across all my leagues?',
            rookie: 'Give me the current top 10 rookie rankings for dynasty in SuperFlex TE premium format with any recent movement.',
            briefing: 'Run my weekly GM briefing. Cover all 4 leagues: roster status, trade opportunities, waiver priorities, and anything I should be acting on this week.'
        };
        
        const input = document.getElementById('message-input');
        input.value = queries[type];
        autoResize(input);
        input.focus();
        
        if (type !== 'trade') {
            sendMessage();
        }
    }

    function addMessage(role, content, imageUrl = null) {
        const welcome = document.getElementById('welcome');
        if (welcome) welcome.remove();

        const messages = document.getElementById('messages');
        const div = document.createElement('div');
        div.className = `message ${role}`;
        
        const label = document.createElement('div');
        label.className = 'message-label';
        label.textContent = role === 'user' ? 'You' : 'Dynasty GM';
        
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        
        if (imageUrl) {
            const img = document.createElement('img');
            img.src = imageUrl;
            bubble.appendChild(img);
        }
        
        if (content) {
            // Simple markdown-like formatting
            const formatted = content
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.+?)\*/g, '<em>$1</em>')
                .replace(/`(.+?)`/g, '<code>$1</code>')
                .replace(/^### (.+)$/gm, '<h3>$1</h3>')
                .replace(/^---$/gm, '<hr>')
                .replace(/\n\n/g, '</p><p>')
                .replace(/\n/g, '<br>');
            
            bubble.innerHTML += `<p>${formatted}</p>`;
        }
        
        div.appendChild(label);
        div.appendChild(bubble);
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
        
        return div;
    }

    function addTypingIndicator() {
        const messages = document.getElementById('messages');
        const div = document.createElement('div');
        div.className = 'message agent';
        div.id = 'typing-indicator';
        
        const label = document.createElement('div');
        label.className = 'message-label';
        label.textContent = 'Dynasty GM';
        
        const typing = document.createElement('div');
        typing.className = 'typing';
        typing.innerHTML = `
            <div class="typing-dots">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>
            <span class="typing-text">Searching live data...</span>
        `;
        
        div.appendChild(label);
        div.appendChild(typing);
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
    }

    function removeTypingIndicator() {
        const indicator = document.getElementById('typing-indicator');
        if (indicator) indicator.remove();
    }

    async function sendMessage() {
        if (isLoading) return;
        
        const input = document.getElementById('message-input');
        const rawMessage = input.value.trim();
        const message = selectedLeaguePrefix + rawMessage;
        
        if (!message && !selectedImage) return;
        
        isLoading = true;
        const sendBtn = document.getElementById('send-btn');
        sendBtn.disabled = true;
        
        // Show user message
        addMessage('user', rawMessage || 'Screenshot analysis', selectedImage);
        
        // Clear input
        input.value = '';
        input.style.height = 'auto';
        removeImage();
        
        // Show typing
        addTypingIndicator();
        
        try {
            const response = await fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: message || 'Please analyze this screenshot in the context of my dynasty fantasy football leagues.',
                    image: selectedImage
                })
            });
            
            const data = await response.json();
            removeTypingIndicator();
            
            if (data.success) {
                addMessage('agent', data.response);
            } else {
                addMessage('agent', `❌ Error: ${data.response}`);
            }
        } catch (err) {
            removeTypingIndicator();
            addMessage('agent', '❌ Connection error. Make sure the server is running.');
        }
        
        isLoading = false;
        sendBtn.disabled = false;
        input.focus();
    }

    async function clearChat() {
        await fetch('/clear', { method: 'POST' });
        const messages = document.getElementById('messages');
        messages.innerHTML = `
            <div class="welcome" id="welcome">
                <div class="welcome-icon">🏈</div>
                <div class="welcome-title">War Room Active</div>
                <div class="welcome-sub">Your dynasty assistant is live with full league context and real-time data access.</div>
                <div class="league-pills">
                    <div class="league-pill active">Capital Gains</div>
                    <div class="league-pill active">Twenty Run Savages</div>
                    <div class="league-pill active">Gentleman's</div>
                    <div class="league-pill">Velvet Spade</div>
                </div>
            </div>
        `;
    }
</script>

</body>
</html>
